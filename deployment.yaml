apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: hansikagondhale250706/myapp:1.0
        command: ["python", "-m", "http.server", "5000"]
        ports:
        - containerPort: 5000